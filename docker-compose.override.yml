# ============================================================
# HyperScale Marketplace — Docker Compose Override (Development)
# ============================================================
#
# This file is automatically loaded alongside unified-docker-compose.yml
# by Docker Compose when running `docker compose up` (without --profile flags).
#
# Key development features:
#   - Hot reload for all Python services (uvicorn --reload)
#   - Debug mode enabled (DEBUG=1)
#   - Verbose logging (LOG_LEVEL=debug)
#   - Source directory mounts for live code updates
#   - Increased resource limits for debugging
#
# Usage:
#   docker compose up -d              # Uses this override automatically
#   docker compose --profile services up -d   # Also uses this override
# ============================================================

services:
  # ============================================================
  # SERVICES — Auth (gRPC) — Dev Override
  # ============================================================

  auth-service:
    profiles: ["services", "all"]
    build:
      context: ./01-auth-service
      dockerfile: Dockerfile
      args:
        - DEV_MODE=true
    volumes:
      - ./01-auth-service/src:/app/src
      - ./01-auth-service/proto:/app/proto
      - ./01-auth-service/pyproject.toml:/app/pyproject.toml
    environment:
      - DEBUG=1
      - LOG_LEVEL=debug
      - LOG_FORMAT=text
      - RELOAD=true
    command: >
      uvicorn src.main:app
      --host 0.0.0.0
      --port 50052
      --reload
      --reload-dir /app/src
      --log-level debug
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

